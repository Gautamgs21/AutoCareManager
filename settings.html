<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>AutoCare - Settings</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "var(--color-primary, #004ac6)",
                        "primary-container": "var(--color-primary-container, #2563eb)",
                        "primary-fixed": "var(--color-primary-fixed, #dbe1ff)",
                        background: "var(--color-background, #f7f9fb)",
                        surface: "var(--color-surface, #f7f9fb)",
                        "surface-container-lowest": "var(--color-surface-container-lowest, #ffffff)",
                        "surface-container-high": "var(--color-surface-container-high, #e6e8ea)",
                        "surface-container-highest": "var(--color-surface-container-highest, #e0e3e5)",
                        "on-background": "var(--color-on-background, #191c1e)",
                        "on-surface": "var(--color-on-surface, #191c1e)",
                        "on-surface-variant": "var(--color-on-surface-variant, #434655)",
                        "slate-text-secondary": "var(--color-text-secondary, #475569)",
                        "slate-border": "var(--color-border, #e2e8f0)",
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --font-family: 'Inter', sans-serif;
            --font-size-base: 14px;
            --font-weight-style: 400;
        }

        html, body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
        }

        body, p, span, a, button, input, select, textarea, h1, h2, h3, h4, h5, h6 {
            font-style: var(--font-style, normal);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
        }

        .settings-card-shadow {
            box-shadow: 0 4px 12px rgba(0, 74, 198, 0.05);
        }
    </style>
    
    <script>
        (function() {
            const savedSettings = JSON.parse(localStorage.getItem('autocare_settings') || '{}');
            
            if (savedSettings.darkMode) {
                document.documentElement.classList.add('dark');
            }

            const schemes = {
                blue: { primary: '#004ac6', container: '#2563eb', fixed: '#dbe1ff', bg: '#f7f9fb', surface: '#ffffff', text: '#191c1e', sub: '#475569', border: '#e2e8f0' },
                emerald: { primary: '#059669', container: '#10b981', fixed: '#d1fae5', bg: '#f8fafc', surface: '#ffffff', text: '#0f172a', sub: '#475569', border: '#e2e8f0' },
                violet: { primary: '#7c3aed', container: '#8b5cf6', fixed: '#ede9fe', bg: '#faf5ff', surface: '#ffffff', text: '#2e1065', sub: '#5b21b6', border: '#e9d5ff' },
                sunset: { primary: '#ea580c', container: '#f97316', fixed: '#ffedd5', bg: '#fff7ed', surface: '#ffffff', text: '#431407', sub: '#7c2d12', border: '#fed7aa' },
                dark: { primary: '#3b82f6', container: '#60a5fa', fixed: '#1e3a8a', bg: '#0f172a', surface: '#1e293b', text: '#f8fafc', sub: '#94a3b8', border: '#334155' }
            };

            const activeScheme = schemes[savedSettings.colorScheme || 'blue'];
            if (activeScheme) {
                const root = document.documentElement;
                root.style.setProperty('--color-primary', activeScheme.primary);
                root.style.setProperty('--color-primary-container', activeScheme.container);
                root.style.setProperty('--color-primary-fixed', activeScheme.fixed);
                root.style.setProperty('--color-background', activeScheme.bg);
                root.style.setProperty('--color-surface', activeScheme.bg);
                root.style.setProperty('--color-surface-container-lowest', activeScheme.surface);
                root.style.setProperty('--color-on-background', activeScheme.text);
                root.style.setProperty('--color-on-surface', activeScheme.text);
                root.style.setProperty('--color-text-secondary', activeScheme.sub);
                root.style.setProperty('--color-border', activeScheme.border);
            }

            if (savedSettings.fontType) {
                document.documentElement.style.setProperty('--font-family', savedSettings.fontType);
            }

            if (savedSettings.fontSize) {
                document.documentElement.style.setProperty('--font-size-base', savedSettings.fontSize + 'px');
            }

            if (savedSettings.fontStyle) {
                if (savedSettings.fontStyle === 'bold') {
                    document.documentElement.style.setProperty('font-weight', '700');
                } else if (savedSettings.fontStyle === 'italic') {
                    document.documentElement.style.setProperty('--font-style', 'italic');
                } else if (savedSettings.fontStyle === 'bold-italic') {
                    document.documentElement.style.setProperty('font-weight', '700');
                    document.documentElement.style.setProperty('--font-style', 'italic');
                }
            }
        })();
    </script>
</head>
<body class="bg-background text-on-background antialiased transition-colors duration-200">

                <div class="grid grid-cols-5 gap-2.5">
                    <button onclick="setScheme('blue')" class="color-scheme-btn flex flex-col items-center gap-1.5 p-2.5 rounded-xl border border-slate-border bg-surface-container-high/50 hover:bg-surface-container-high transition-all cursor-pointer" data-scheme="blue">

                        <div class="w-6 h-6 rounded-full bg-[#7c3aed] shadow-sm"></div>

                    </button>
                    <button onclick="setScheme('sunset')" class="color-scheme-btn flex flex-col items-center gap-1.5 p-2.5 rounded-xl border border-slate-border bg-surface-container-high/50 hover:bg-surface-container-high transition-all cursor-pointer" data-scheme="sunset">

                    </button>
                    <button onclick="setScheme('dark')" class="color-scheme-btn flex flex-col items-center gap-1.5 p-2.5 rounded-xl border border-slate-border bg-surface-container-high/50 hover:bg-surface-container-high transition-all cursor-pointer" data-scheme="dark">

                    </button>

        </div>

        <!-- 3. Typography Customization -->
        <div class="bg-surface-container-lowest rounded-2xl border border-slate-border p-5 settings-card-shadow box-border space-y-4">
            <h3 class="font-bold text-on-surface text-xs uppercase tracking-wider">Typography Settings</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-text-secondary uppercase tracking-wider mb-1">Font Family</label>
                    <select id="font-family-select" class="w-full bg-surface-container-high border border-slate-border rounded-xl px-3 py-2.5 text-sm text-on-surface outline-none cursor-pointer">
                        <option value="'Inter', sans-serif">Inter (Default)</option>
                        <option value="'Plus Jakarta Sans', sans-serif">Plus Jakarta Sans</option>
                        <option value="'Outfit', sans-serif">Outfit</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-text-secondary uppercase tracking-wider mb-1">Base Font Size</label>
                    <select id="font-size-select" class="w-full bg-surface-container-high border border-slate-border rounded-xl px-3 py-2.5 text-sm text-on-surface outline-none cursor-pointer">

                        <option value="14" selected>Normal (14px)</option>

            <div>

    <!-- JavaScript -->
    <script>
        lucide.createIcons();

        // Load saved settings into UI
        document.addEventListener('DOMContentLoaded', () => {
            const settings = JSON.parse(localStorage.getItem('autocare_settings') || '{}');
            
            if (settings.darkMode) {
                document.getElementById('dark-mode-toggle').checked = true;
            }
            if (settings.userName) {
                document.getElementById('user-name-input').value = settings.userName;
            }
            if (settings.profileImage) {
                document.getElementById('settings-avatar-preview').src = settings.profileImage;
                document.getElementById('global-profile-avatar').src = settings.profileImage;
            }
            if (settings.colorScheme) {
                document.querySelectorAll('.color-scheme-btn').forEach(btn => {
                    if (btn.dataset.scheme === settings.colorScheme) {
                        btn.classList.add('ring-2', 'ring-primary');
                    }
                });
            }
            if (settings.fontType) {
                document.getElementById('font-family-select').value = settings.fontType;
            }
            if (settings.fontSize) {
                document.getElementById('font-size-select').value = settings.fontSize;
            }
            if (settings.fontStyle) {
                document.getElementById('font-style-select').value = settings.fontStyle;
            }
        });

        function setScheme(schemeName) {
            document.querySelectorAll('.color-scheme-btn').forEach(b => b.classList.remove('ring-2', 'ring-primary'));
            event.currentTarget.classList.add('ring-2', 'ring-primary');
            
            const schemes = {
                blue: { primary: '#004ac6', container: '#2563eb', fixed: '#dbe1ff', bg: '#f7f9fb', surface: '#ffffff', text: '#191c1e', sub: '#475569', border: '#e2e8f0' },
                emerald: { primary: '#059669', container: '#10b981', fixed: '#d1fae5', bg: '#f8fafc', surface: '#ffffff', text: '#0f172a', sub: '#475569', border: '#e2e8f0' },
                violet: { primary: '#7c3aed', container: '#8b5cf6', fixed: '#ede9fe', bg: '#faf5ff', surface: '#ffffff', text: '#2e1065', sub: '#5b21b6', border: '#e9d5ff' },
                sunset: { primary: '#ea580c', container: '#f97316', fixed: '#ffedd5', bg: '#fff7ed', surface: '#ffffff', text: '#431407', sub: '#7c2d12', border: '#fed7aa' },
                dark: { primary: '#3b82f6', container: '#60a5fa', fixed: '#1e3a8a', bg: '#0f172a', surface: '#1e293b', text: '#f8fafc', sub: '#94a3b8', border: '#334155' }
            };

            const s = schemes[schemeName];
            if (s) {
                document.documentElement.style.setProperty('--color-primary', s.primary);
                document.documentElement.style.setProperty('--color-primary-container', s.container);
                document.documentElement.style.setProperty('--color-primary-fixed', s.fixed);
                document.documentElement.style.setProperty('--color-background', s.bg);
                document.documentElement.style.setProperty('--color-surface', s.bg);
                document.documentElement.style.setProperty('--color-surface-container-lowest', s.surface);
                document.documentElement.style.setProperty('--color-on-background', s.text);
                document.documentElement.style.setProperty('--color-on-surface', s.text);
                document.documentElement.style.setProperty('--color-text-secondary', s.sub);
                document.documentElement.style.setProperty('--color-border', s.border);
            }
            window.activeSelectedScheme = schemeName;
        }

        // Handle avatar image upload
        document.getElementById('avatar-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('settings-avatar-preview').src = event.target.result;
                    document.getElementById('global-profile-avatar').src = event.target.result;
                    window.tempProfileImage = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function saveAllSettings() {
            const darkMode = document.getElementById('dark-mode-toggle').checked;
            const userName = document.getElementById('user-name-input').value;
            const colorScheme = window.activeSelectedScheme || JSON.parse(localStorage.getItem('autocare_settings') || '{}').colorScheme || 'blue';
            const fontType = document.getElementById('font-family-select').value;
            const fontSize = document.getElementById('font-size-select').value;
            const fontStyle = document.getElementById('font-style-select').value;
            const profileImage = window.tempProfileImage || JSON.parse(localStorage.getItem('autocare_settings') || '{}').profileImage;

            const settings = {
                darkMode,
                userName,
                colorScheme,
                fontType,
                fontSize,
                fontStyle,
                profileImage
            };

            localStorage.setItem('autocare_settings', JSON.stringify(settings));
            alert('Settings saved successfully!');
            location.reload();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "autocare_backup.json");
            dlAnchorElem.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        for (let key in imported) {
                            localStorage.setItem(key, imported[key]);
                        }
                        alert('Data imported successfully!');
                        location.reload();
                    } catch (err) {
                        alert('Invalid backup file.');
                    }
                };
                reader.readAsText(file);
            }
        }

        function clearData() {
            if (confirm('Are you sure you want to reset all app data? This cannot be undone.')) {
                localStorage.clear();
                alert('App data reset.');
                location.reload();
            }
        }
    </script>
</body>
</html>

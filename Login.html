<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare - Fleet & Vehicle Intelligence System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#f7f9fb] dark:bg-slate-950 flex flex-col justify-center items-center p-4 sm:p-6 transition-colors text-lg">

    <!-- INTRO LOADER SCREEN (Simple & Clean) -->
    <div id="intro-loader" class="fixed inset-0 z-50 bg-white text-slate-900 flex flex-col items-center justify-center p-4 sm:p-6 select-none transition-opacity duration-500">
        <div class="relative z-10 flex flex-col items-center max-w-sm w-full gap-6">
            <!-- Logo display with subtle pulse -->
            <div class="flex flex-col items-center gap-4 animate-pulse">
                <img src="https://github.com/Gautamgs21/AutoCareManager/blob/4af2d708a8ab950c414bd751dc8cc1c354604d29/assets/logo.png?raw=true" alt="AutoCare Logo" class="w-24 h-24 object-contain drop-shadow-sm" />
                <h1 class="text-3xl font-extrabold text-blue-700 tracking-tight">AutoCare</h1>
            </div>

            <!-- Simple Loading Spinner -->
            <div class="flex items-center justify-center pt-2">
                <i data-lucide="loader-2" class="w-8 h-8 text-blue-600 animate-spin"></i>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div class="w-full max-w-[440px] bg-white dark:bg-slate-900 rounded-3xl shadow-lg border border-slate-200 dark:border-slate-800 p-6 sm:p-8 flex flex-col gap-6 relative">
        
        <!-- Header Branding -->
        <div class="flex flex-col items-center text-center gap-3">
            <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-md overflow-hidden border border-slate-100">
                <img src="https://github.com/Gautamgs21/AutoCareManager/blob/4af2d708a8ab950c414bd751dc8cc1c354604d29/assets/logo.png?raw=true" alt="Logo" class="w-10 h-10 object-contain" />
            </div>
            <div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-blue-700 dark:text-blue-400 tracking-tight">
                    AutoCare
                </h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mt-0.5">
                    Fleet & Vehicle Intelligence System
                </p>
            </div>
        </div>

        <!-- Error Alert -->
        <div id="error-alert" class="hidden bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-base px-4 py-2.5 rounded-xl text-center font-medium"></div>

        <!-- Sign In Form -->
        <form id="signin-form" class="flex flex-col gap-4">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
                    Sign In
                </h2>
            </div>

            <!-- UserID / Email -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="auth-userid">
                    UserID / Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </span>
                    <input
                        id="auth-userid"
                        type="text"
                        class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl py-3 pl-11 pr-4 text-base text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all"
                        required
                    />
                </div>
            </div>

            <!-- Password -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="auth-password">
                        Password
                    </label>
                    <button
                        type="button"
                        id="forgot-password-btn"
                        class="text-sm font-semibold text-blue-600 dark:text-blue-400 hover:underline cursor-pointer"
                    >
                        Forgot Password?
                    </button>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input
                        id="auth-password"
                        type="password"
                        class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl py-3 pl-11 pr-11 text-base text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all"
                        required
                    />
                    <button
                        type="button"
                        id="toggle-password"
                        class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer"
                        aria-label="Toggle password visibility"
                    >
                        <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Action Button -->
            <button
                id="auth-signin-submit"
                type="submit"
                class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-base py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer"
            >
                <span id="btn-text">Sign In</span>
                <i data-lucide="arrow-right" id="btn-icon" class="w-5 h-5"></i>
            </button>
        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
            <h3 class="font-bold text-lg text-slate-900 dark:text-white">Account Access Help</h3>
            <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                AutoCare is currently in single-user/fleet-manager mode. You can sign in using any credentials or default ID: 
                <span class="font-mono bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-blue-600 ml-1">@alex_morgan</span>
            </p>
            <div class="flex justify-end gap-2 pt-2">
                <button
                    id="use-demo-btn"
                    class="px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-xl hover:bg-blue-700 cursor-pointer"
                >
                    Use Demo Login
                </button>
                <button
                    id="close-modal-btn"
                    class="px-4 py-2 border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer"
                >
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Handling Interactivity & Intro Loader -->
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Simple Loader Handler (dismisses automatically after 1.8 seconds)
        const loader = document.getElementById('intro-loader');

        function finishLoader() {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        setTimeout(finishLoader, 1800);

        // App Form Elements
        const form = document.getElementById('signin-form');
        const userIdInput = document.getElementById('auth-userid');
        const passwordInput = document.getElementById('auth-password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        const errorAlert = document.getElementById('error-alert');
        const submitBtn = document.getElementById('auth-signin-submit');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        
        const forgotBtn = document.getElementById('forgot-password-btn');
        const forgotModal = document.getElementById('forgot-modal');
        const useDemoBtn = document.getElementById('use-demo-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Toggle Password Visibility
        let showPassword = false;
        togglePasswordBtn.addEventListener('click', () => {
            showPassword = !showPassword;
            passwordInput.type = showPassword ? 'text' : 'password';
            
            eyeIcon.setAttribute('data-lucide', showPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // Modal Open/Close
        forgotBtn.addEventListener('click', () => forgotModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => forgotModal.classList.add('hidden'));

        // Use Demo Login
        useDemoBtn.addEventListener('click', () => {
            userIdInput.value = '@alex_morgan';
            passwordInput.value = 'password123';
            forgotModal.classList.add('hidden');
        });

        // Form Submission Handler
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!userIdInput.value.trim() || !passwordInput.value) {
                errorAlert.textContent = 'Please enter both User ID and Password.';
                errorAlert.classList.remove('hidden');
                return;
            }

            errorAlert.classList.add('hidden');
            
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = 'Signing In...';
            btnIcon.setAttribute('data-lucide', 'loader-2');
            btnIcon.classList.add('animate-spin');
            lucide.createIcons();

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Sign In';
                btnIcon.setAttribute('data-lucide', 'arrow-right');
                btnIcon.classList.remove('animate-spin');
                lucide.createIcons();

                alert('Successfully signed in as ' + userIdInput.value.trim() + '!');
            }, 500);
        });
    </script>
</body>
</html>

            <div class="flex items-center gap-3">
                <a href="dashboard.html" id="top-logo-btn" class="flex items-center gap-3 text-left group cursor-pointer focus:outline-none" aria-label="AutoCare Dashboard">
                    <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center shadow-xs border border-slate-100 overflow-hidden">
                        <i data-lucide="car" class="w-5 h-5 text-emerald-600"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg sm:text-xl tracking-tight text-slate-900">
                            AutoCare <span class="text-emerald-600 font-semibold text-xs sm:text-sm">v1.0</span>
                        </span>
                    </div>
                </a>
            </div>
            <div class="flex items-center gap-2.5 sm:gap-4">
                <a href="settings.html" id="top-profile-btn" class="relative rounded-full p-0.5 border-2 border-slate-200 shadow-xs hover:scale-105 transition-all cursor-pointer" aria-label="Profile and Settings">
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=300&auto=format&fit=crop" alt="Profile avatar" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full object-cover bg-slate-100" referrerpolicy="no-referrer" />

                </a>
            </div>
        </div>
    </header>

        <div class="flex items-center justify-between">
            <h2 class="text-[30px] font-extrabold text-on-surface tracking-wider">Vehicles</h2>
            <a href="vehicles.html" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-primary/90 transition-colors">
                + Add Vehicle
            </a>
        </div>
        
        <!-- Placeholder content -->
        <div class="bg-surface-container-lowest rounded-2xl border border-slate-border shadow-sm p-12 text-center">
            <span class="material-symbols-outlined text-6xl text-slate-text-secondary mb-4">directions_car</span>
            <h3 class="text-xl font-bold text-on-surface mb-2">Vehicle Management</h3>
            <p class="text-slate-text-secondary">Your vehicles will appear here. Coming soon!</p>
        </div>
    </main>

        <div class="max-w-6xl mx-auto h-16 px-2 sm:px-4 flex justify-around items-center">
            <a href="dashboard.html" class="flex-1 flex flex-col items-center justify-center py-1 px-1 sm:px-2 rounded-xl transition-all duration-200 active:scale-95 cursor-pointer text-[#737686] hover:text-slate-800 font-medium">

                <div class="px-3 py-1 rounded-xl flex items-center justify-center transition-all bg-[#dbe1ff] scale-105 shadow-xs">
                    <i data-lucide="car" class="w-4 h-4 sm:w-5 sm:h-5 stroke-[2.5]"></i>
                </div>
                <span class="text-[10px] sm:text-[11px] tracking-tight mt-0.5 font-bold truncate">Vehicles</span>
            </a>
            
            <a href="fuel.html" class="flex-1 flex flex-col items-center justify-center py-1 px-1 sm:px-2 rounded-xl transition-all duration-200 active:scale-95 cursor-pointer text-[#737686] hover:text-slate-800 font-medium">
                <div class="px-3 py-1 rounded-xl flex items-center justify-center transition-all">
                    <i data-lucide="fuel" class="w-4 h-4 sm:w-5 sm:h-5 stroke-[1.75]"></i>

                <span class="text-[10px] sm:text-[11px] tracking-tight mt-0.5 font-bold truncate">Fuel</span>

            </a>
